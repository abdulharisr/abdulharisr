<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">Let's connect — mulai percakapan.</title><desc id="desc">Diskusi tentang web, jaringan, dan teknologi pendidikan. Hubungi Abdul Haris Rosa melalui tautan kontak di bawah banner.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10242a"/><stop offset="1" stop-color="#111629"/></linearGradient><clipPath id="clip"><rect width="1000" height="240" rx="20"/></clipPath></defs><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translateY(-12px)}}
@keyframes breathe{50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes cursor{0%,45%{opacity:1}50%,95%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-160px)}100%{transform:translateX(1120px)}}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.float{animation:drift 8s ease-in-out infinite}
.pulse{animation:breathe 6s ease-in-out infinite}
.flow{animation:flow 14s linear infinite}
.cursor{animation:cursor 2s steps(1) infinite}
.sweep{animation:sweep 12s linear infinite}
@media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.flow,.cursor,.sweep{animation:none!important}}
</style>
<g clip-path="url(#clip)"><rect width="1000" height="240" fill="url(#bg)"/><g transform="translate(870 120)"><g class="orbit"><circle r="109" stroke="#65f4cf" stroke-opacity=".23" fill="none" stroke-dasharray="80 16"/><circle r="148" stroke="#acb5ff" stroke-opacity=".14" fill="none"/><circle cx="109" r="5" fill="#65f4cf"/></g><path class="float" d="M-25 23L27-29M-9-29H27V7" stroke="#65f4cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="12" letter-spacing="3" fill="#65f4cf">IDE YANG BAIK DIMULAI DARI PERCAKAPAN</text><text x="37" y="111" font-size="49" font-weight="700" fill="#f0f6ff" letter-spacing="-2">Let's connect.</text><text x="40" y="156" font-size="18" fill="#b1c3d7">Web, jaringan, atau teknologi pendidikan?</text><text x="40" y="186" font-size="18" fill="#b1c3d7">Mari bertukar ide dan pengetahuan.</text></g></g></svg>