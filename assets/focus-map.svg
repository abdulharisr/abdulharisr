<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc"><title id="title">Code. Connect. Educate.</title><desc id="desc">Tiga bidang eksplorasi: pengembangan web, jaringan komputer, dan teknologi pendidikan.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111d2c"/><stop offset="1" stop-color="#090f1c"/></linearGradient></defs>
<style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translateY(-12px)}}
@keyframes breathe{50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes cursor{0%,45%{opacity:1}50%,95%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-160px)}100%{transform:translateX(1120px)}}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}
.reverse{animation-direction:reverse;animation-duration:48s}
.float{animation:drift 8s ease-in-out infinite}
.pulse{animation:breathe 6s ease-in-out infinite}
.flow{animation:flow 14s linear infinite}
.cursor{animation:cursor 2s steps(1) infinite}
.sweep{animation:sweep 12s linear infinite}
@media(prefers-reduced-motion:reduce){.orbit,.float,.pulse,.flow,.cursor,.sweep{animation:none!important}}
</style>
<rect x="1" y="1" width="998" height="208" rx="20" fill="url(#bg)" stroke="#29354b"/>
<path d="M320 35V175M655 35V175" stroke="#29354b"/>
<path class="flow" d="M50 176H945" fill="none" stroke="#65f4cf" stroke-opacity=".36" stroke-dasharray="5 15"/>
<g font-family="Arial, sans-serif">
<text x="32" y="42" fill="#65f4cf" font-size="12" letter-spacing="2">01 / CODE</text>
<text x="32" y="91" fill="#f1f5fd" font-size="30" font-weight="700">Build.</text>
<text x="32" y="126" fill="#a7bad2" font-size="17">Web &amp; sistem informasi</text>
<text x="32" y="152" fill="#a7bad2" font-size="15">PHP · JavaScript · MySQL</text>
<text x="352" y="42" fill="#a6b6ff" font-size="12" letter-spacing="2">02 / CONNECT</text>
<text x="352" y="91" fill="#f1f5fd" font-size="30" font-weight="700">Connect.</text>
<text x="352" y="126" fill="#a7bad2" font-size="17">Jaringan &amp; infrastruktur</text>
<text x="352" y="152" fill="#a7bad2" font-size="15">MikroTik · Linux · TKJ</text>
<text x="688" y="42" fill="#f3c883" font-size="12" letter-spacing="2">03 / EDUCATE</text>
<text x="688" y="91" fill="#f1f5fd" font-size="30" font-weight="700">Share.</text>
<text x="688" y="126" fill="#a7bad2" font-size="17">Teknologi untuk pendidikan</text>
<text x="688" y="152" fill="#a7bad2" font-size="15">Pembelajaran · SPK · SAW</text>
</g>
<g class="pulse" fill="#65f4cf"><circle cx="286" cy="36" r="4"/><circle cx="621" cy="36" r="4"/><circle cx="960" cy="36" r="4"/></g>
</svg>